<!-- =====================================================================
     🎙️ VOICE CO-ASSISTANT  (v3)
     - Fully automatic: starts listening as soon as you are inside the portal
       (no tap needed). Only reacts to the wake phrase "Co Assistant".
     - Say "Co Assistant" + a command in one go, or say "Co Assistant", wait for
       the chime, then say the command.
     - A full-screen overlay opens in the CENTER of the screen with the AI logo
       above a live transcript of what you are saying.
     - 5-second countdown before EVERY command. During it you can say "cancel" to
       stop the command, or "edit" to throw it away and say a new one.
     - Questions / longer requests open the Co Assistant AI page and the answer is
       written there as text (short answers are also read out loud).
     Everything lives in this one block. Delete it to remove voice control.
     ===================================================================== -->
<style id="va-styles">
    .va-hidden { display: none !important; }

    /* Mic button (lives in the header next to the theme toggle) */
    #va-mic-btn { position: relative; }
    #va-mic-btn.va-on { color: #c4b5fd; border-color: rgba(139,92,246,.7); animation: vaPulse 2.2s infinite; }
    #va-mic-btn.va-awake { color: #e9d5ff; border-color: rgba(192,132,252,.9); animation-duration: 1s; }
    #va-mic-btn.va-fab { position: fixed; right: 16px; bottom: 90px; z-index: 99990; width: 48px; height: 48px; border-radius: 999px; }
    @keyframes vaPulse {
        0%   { box-shadow: 0 0 0 0 rgba(168,85,247,.5); }
        70%  { box-shadow: 0 0 0 10px rgba(168,85,247,0); }
        100% { box-shadow: 0 0 0 0 rgba(168,85,247,0); }
    }

    /* ---------- Full-screen centered overlay ---------- */
    /* Palette: everything stays in the purple family so it matches the logo.
       Deep violet base, violet / orchid glow, lilac text. Cancel / Edit keep red / amber so they still read as actions. */
    #va-overlay {
        /* glow colours as r,g,b — they shift slightly with the mode (see the data-mode rules below) */
        --va-a: 168,85,247;
        --va-b: 192,132,252;
        --va-ink: 245,243,255;               /* text colour */
        --va-wave: .5;                       /* how visible the waves are (kept low on purpose) */
        position: fixed; inset: 0; z-index: 100000; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        padding: max(16px, env(safe-area-inset-top)) 20px max(16px, env(safe-area-inset-bottom));
        color: rgb(var(--va-ink));
        /* No backdrop blur on purpose: a full-screen blur over a page that is still animating underneath is what made
           phones stutter. This gradient is almost opaque, so it looks just as deep and costs far less to draw. */
        background:
            radial-gradient(circle at 50% 24%, rgba(var(--va-a), .32), transparent 56%),
            radial-gradient(circle at 50% 88%, rgba(var(--va-b), .16), transparent 62%),
            radial-gradient(circle at 50% 42%, rgba(59,20,120,.55), rgba(9,3,22,.95) 76%);
        opacity: 0; visibility: hidden; pointer-events: none;
        transition: opacity .25s ease, visibility 0s linear .25s;
    }
    #va-overlay.va-show { opacity: 1; visibility: visible; pointer-events: auto; transition: opacity .25s ease; }
    #va-overlay[data-mode="awake"]     { --va-a: 168,85,247;  --va-b: 232,121,249; --va-wave: .55; }
    #va-overlay[data-mode="countdown"] { --va-a: 192,132,252; --va-b: 129,140,248; --va-wave: .38; }
    #va-overlay[data-mode="reply"]     { --va-a: 139,92,246;  --va-b: 196,181,253; --va-wave: .45; }
    .light-theme #va-overlay {
        --va-ink: 46,16,101;
        background:
            radial-gradient(circle at 50% 24%, rgba(var(--va-a), .22), transparent 56%),
            radial-gradient(circle at 50% 42%, rgba(221,214,254,.78), rgba(250,245,255,.97) 76%);
    }

    /* The card is a real, distinct panel — a soft violet glass surface with its own border,
       depth shadow and glow. It still never clips the waves/glow around the logo (grown via negative margin below). */
    #va-card {
        width: min(560px, 100%); max-height: 100%; position: relative;
        display: flex; flex-direction: column; align-items: center; text-align: center; gap: 16px;
        padding: 30px 26px 26px;
        border-radius: 28px;
        background: linear-gradient(180deg, rgba(46,16,101,.55), rgba(20,7,46,.86));
        border: 1px solid rgba(var(--va-a), .32);
        box-shadow:
            0 24px 60px -12px rgba(4,1,14,.7),
            0 1px 0 rgba(255,255,255,.10) inset,
            0 0 0 1px rgba(255,255,255,.03) inset,
            0 0 90px -26px rgba(var(--va-a), .55);
        transform: scale(.94); transition: transform .25s ease, border-color .5s ease, box-shadow .5s ease;
    }
    .light-theme #va-card {
        background: linear-gradient(180deg, rgba(255,255,255,.88), rgba(250,245,255,.97));
        border-color: rgba(139,92,246,.28);
        box-shadow: 0 24px 60px -14px rgba(76,29,149,.25), 0 0 0 1px rgba(255,255,255,.6) inset, 0 0 90px -30px rgba(139,92,246,.4);
    }
    #va-overlay.va-show #va-card { transform: scale(1); }

    /* ---------- Logo + simple circular waves (soft violet, brighter orchid while speaking) ---------- */
    #va-stage {
        --s: min(300px, 38vh);               /* size of the whole animated area */
        --L: calc(var(--s) * .36);           /* logo size */
        --va-wr: 167,139,250;                /* wave colour: soft violet by default */
        position: relative; flex: none; width: var(--s); height: var(--s);
        display: flex; align-items: center; justify-content: center;
        margin: calc(var(--s) * -.05) 0;
    }
    #va-overlay.va-speaking #va-stage { --va-wr: 216,180,254; }   /* brighter orchid while it is talking */
    .light-theme #va-stage { --va-wr: 139,92,246; }
    .light-theme #va-overlay.va-speaking #va-stage { --va-wr: 124,58,237; }

    /* Soft ambient glow breathing behind everything — brings some life back
       to the stage on phones, where a couple of thin rings alone looked flat. */
    #va-stage::before {
        content: ''; position: absolute; left: 50%; top: 50%; border-radius: 50%; pointer-events: none;
        width: calc(var(--L) * 2.3); height: calc(var(--L) * 2.3); margin: calc(var(--L) * -1.15) 0 0 calc(var(--L) * -1.15);
        background: radial-gradient(circle, rgba(var(--va-wr), .32) 0%, rgba(var(--va-wr), .10) 50%, rgba(var(--va-wr), 0) 72%);
        animation: vaBreathe 2.6s ease-in-out infinite;
    }
    @keyframes vaBreathe { 0%, 100% { transform: scale(.9); opacity: .75; } 50% { transform: scale(1.1); opacity: 1; } }

    /* Waves that ring the logo and drift outward, fading as they go */
    .va-wave-out {
        --va-reach: 2.6;
        position: absolute; left: 50%; top: 50%; width: var(--L); height: var(--L);
        margin: calc(var(--L) / -2) 0 0 calc(var(--L) / -2);
        border-radius: 50%; pointer-events: none; opacity: 0;
        border: 2.5px solid rgba(var(--va-wr), .6);
        animation: vaWaveOut 2.8s cubic-bezier(.16,.6,.3,1) infinite;
        will-change: transform, opacity; transition: border-color .5s ease;
    }
    .va-wave-out:nth-of-type(2) { animation-delay: .93s; }
    .va-wave-out:nth-of-type(3) { animation-delay: 1.86s; }
    @keyframes vaWaveOut {
        0%   { transform: scale(1); opacity: 0; }
        18%  { opacity: .7; }
        100% { transform: scale(var(--va-reach)); opacity: 0; }
    }

    /* Waves that draw inward from further out, toward the logo */
    .va-wave-in {
        position: absolute; left: 50%; top: 50%; width: var(--L); height: var(--L);
        margin: calc(var(--L) / -2) 0 0 calc(var(--L) / -2);
        border-radius: 50%; pointer-events: none; opacity: 0;
        border: 2.5px solid rgba(var(--va-wr), .6);
        animation: vaWaveIn 2.8s cubic-bezier(.4,0,.5,1) infinite;
        will-change: transform, opacity; transition: border-color .5s ease;
    }
    .va-wave-in:nth-of-type(2) { animation-delay: 1.4s; }
    @keyframes vaWaveIn {
        0%   { transform: scale(2.6); opacity: 0; }
        45%  { opacity: .7; }
        100% { transform: scale(1); opacity: 0; }
    }
    #va-overlay[data-mode="countdown"] .va-wave-out,
    #va-overlay[data-mode="countdown"] .va-wave-in { animation-duration: 3.6s; }

    /* One-shot "click" burst — fires the instant the wake word lands, or a
       command gets confirmed, so it actually feels tapped/heard rather than
       just fading in like the ambient waves do. */
    .va-click-ring {
        position: absolute; left: 50%; top: 50%; width: var(--L); height: var(--L);
        margin: calc(var(--L) / -2) 0 0 calc(var(--L) / -2);
        border-radius: 50%; pointer-events: none; opacity: 0;
        border: 3px solid rgba(var(--va-wr), .95);
    }
    .va-click-ring.va-fire { animation: vaClick .55s cubic-bezier(.2,.8,.2,1); }
    @keyframes vaClick { 0% { transform: scale(.75); opacity: .95; } 100% { transform: scale(2.3); opacity: 0; } }

    /* The logo itself */
    #va-logo-wrap { position: relative; z-index: 2; width: var(--L); height: var(--L); flex: none; animation: vaLogo 2.4s ease-in-out infinite; }
    #va-logo-wrap.va-fire { animation: vaLogoClick .4s ease-out; }
    @keyframes vaLogo { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes vaLogoClick { 0% { transform: scale(1); } 35% { transform: scale(1.18); } 100% { transform: scale(1); } }
    #va-logo {
        display: block; width: 100%; height: 100%; object-fit: contain; padding: 17%; box-sizing: border-box; border-radius: 50%;
        background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.18), rgba(30,10,64,.88) 68%);
        border: 1px solid rgba(216,180,254,.32);
        box-shadow: 0 8px 34px rgba(var(--va-wr), .5), inset 0 0 22px rgba(var(--va-wr), .3);
        transition: box-shadow .5s ease;
    }
    .light-theme #va-logo { background: radial-gradient(circle at 30% 22%, rgba(255,255,255,.95), rgba(237,233,254,.92) 70%); border-color: rgba(139,92,246,.4); }

    @media (prefers-reduced-motion: reduce) {
        .va-wave-out, .va-wave-in, .va-click-ring.va-fire, #va-logo-wrap, #va-logo-wrap.va-fire, #va-stage::before { animation: none !important; }
    }

    /* ---------- Texts ---------- */
    #va-status {
        display: inline-flex; align-items: center; gap: 9px; max-width: 100%;
        padding: 7px 16px; border-radius: 999px;
        font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: rgb(var(--va-ink));
        background: rgba(var(--va-a), .18); border: 1px solid rgba(var(--va-a), .45);
        box-shadow: 0 4px 18px -6px rgba(var(--va-a), .55);
        transition: background-color .5s ease, border-color .5s ease, box-shadow .5s ease;
    }
    #va-status::before {
        content: ''; flex: none; width: 7px; height: 7px; border-radius: 50%;
        background: rgb(var(--va-a)); box-shadow: 0 0 10px rgb(var(--va-a)); animation: vaBlink 1.2s ease-in-out infinite;
    }
        #va-was { margin-top: -4px; font-size: 12px; opacity: .6; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #va-heard {
        min-height: 2.6em; width: 100%; padding: 0 6px;
        font-size: clamp(20px, 5vw, 30px); font-weight: 700; line-height: 1.3; word-break: break-word;
        text-shadow: 0 2px 18px rgba(var(--va-a), .35);
    }
    #va-heard:empty::before { content: '…'; opacity: .45; }
    #va-heard.va-interim { opacity: .7; }
    #va-heard.va-interim::after { content: '▍'; margin-left: 2px; animation: vaBlink 1s infinite; }
    @keyframes vaBlink { 50% { opacity: .15; } }

    /* Countdown */
    #va-count { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
    #va-count .va-ring { position: relative; width: 124px; height: 124px; }
    #va-count .va-ring svg { width: 100%; height: 100%; }
    #va-count .va-ring-bg { fill: none; stroke: rgba(196,181,253,.2); stroke-width: 5; }
    #va-ring-fg { fill: none; stroke: rgb(var(--va-a)); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 276.46; stroke-dashoffset: 0; transform: rotate(-90deg); transform-origin: 50% 50%; }
    #va-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 46px; font-weight: 900; font-family: 'JetBrains Mono', monospace; }
    #va-action { font-weight: 800; font-size: 18px; }
    #va-detail { font-size: 13px; opacity: .75; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #va-count small { opacity: .65; font-size: 11px; }
    #va-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 4px; }

    /* Text reply (help / progress) */
    #va-reply { width: 100%; max-height: 34vh; overflow-y: auto; font-size: 15px; line-height: 1.55; padding: 12px 16px; border-radius: 16px; background: rgba(30,10,64,.55); border: 1px solid rgba(var(--va-a), .3); text-align: left; }
    .light-theme #va-reply { background: rgba(255,255,255,.8); border-color: #ddd6fe; }

    #va-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px; }
    #va-overlay button { cursor: pointer; border-radius: 12px; border: 1px solid rgba(var(--va-a), .38); background: rgba(var(--va-a), .14); color: inherit; font-weight: 700; font-size: 12px; padding: 8px 14px; min-height: 36px; transition: background-color .2s ease, border-color .2s ease; }
    #va-overlay button:hover { background: rgba(var(--va-a), .3); }
    #va-overlay #va-cancel { border-color: rgba(251,113,133,.55); color: #fda4af; }
    #va-overlay #va-edit { border-color: rgba(251,191,36,.55); color: #fcd34d; }
    .light-theme #va-overlay #va-cancel { color: #be123c; }
    .light-theme #va-overlay #va-edit { color: #b45309; }
    #va-overlay #va-now { border-color: transparent; color: #fff; background: linear-gradient(135deg, #7c3aed, #a855f7); box-shadow: 0 6px 18px -6px rgba(124,58,237,.7); }
    #va-overlay #va-now:hover { background: linear-gradient(135deg, #8b5cf6, #c084fc); }
    #va-overlay #va-off { opacity: .65; font-weight: 600; }

    /* Short screens (phones held sideways, small laptops): shrink so everything still fits */
    @media (max-height: 660px) {
        #va-stage { --s: min(230px, 30vh); }
        #va-card { gap: 8px; }
        #va-count .va-ring { width: 92px; height: 92px; }
        #va-num { font-size: 34px; }
        #va-heard { min-height: 1.6em; font-size: 18px; }
    }
</style>

<script id="va-script">
(function () {
    'use strict';
    if (window.__vaLoaded) return;
    window.__vaLoaded = true;

    // ------------------------------------------------------------------
    // SETTINGS — tweak these
    // ------------------------------------------------------------------
    // Phones / tablets get gentler timings below: fewer mic restarts and a longer "ignore my own voice" tail.
    const IS_TOUCH = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');

    const CFG = {
        COUNTDOWN_SECONDS: 5,          // countdown before EVERY command runs
        LANG: 'en-US',                 // English recognition locale
        AR_LANG: 'ar-SA',              // Arabic recognition locale
        TTS_LANG: 'en-US',             // voice used to talk back (Arabic text auto-switches to ar-SA)
        SPEAK_RATE: 1.0,
        AUTO_START: true,              // start listening by itself when you are inside the portal
        COMMAND_WINDOW_MS: 10000,      // after saying only "Co Assistant", how long it waits for the command
        ANSWER_TIMEOUT_MS: 60000,      // give up waiting for the AI after this long
        SPEAK_ANSWER_MAX_CHARS: 220,   // AI answers up to this length are also read aloud; longer ones stay as text only
        MAX_SPOKEN_CHARS: 600,         // safety cap for anything else that is read aloud
        ECHO_TAIL_MS: IS_TOUCH ? 1600 : 900,   // ignore the mic right after it finishes talking (phone speakers are close to the mic, so wait longer)
        SPEAK_CONFIRM: true,           // say "Opening dashboard" when the countdown starts
        CHIME: true,                   // soft chime when it wakes up
        TICK_SOUND: true,              // soft tick on every countdown second
        CMD_SILENCE_MS: 1200,          // how long to wait after you stop talking before running the command (lets "what's 3 + 4" finish instead of firing on "what's")
        IDLE_SILENCE_BEFORE_SWITCH_MS: IS_TOUCH ? 4000 : 3000,   // only swap the mic's language after this long of actual silence — never mid-sentence
        IDLE_LANG_SWITCH_MIN_GAP_MS: IS_TOUCH ? 16000 : 6000,    // don't swap more often than this (every swap restarts the mic, which is what phones struggle with)
        IDLE_LANG_CHECK_MS: 1000              // how often to check whether a swap is due
    };

    // Wake phrase: "co assistant" plus the ways speech engines usually mis-hear it
    // (co-assistant, coassistant, code assistant, go assistant, co assist, co assistance ...).
    const WAKE_SRC = '(?:co|coe|ko|koh|kow|go|code|call|coo|cu|kuh|cuz|quo)[\\s-]*(?:assistants?|assistance|assistent|assist(?:ing|ed)?)';
    const WAKE_RE    = new RegExp('\\b' + WAKE_SRC + '\\b');
    const WAKE_START = new RegExp('^' + WAKE_SRC + '\\b[\\s,.:-]*');

    // "Co Assistant Arabic" / "Co Assistant عربي" — said right after the plain English wake phrase —
    // explicitly switches THIS interaction to Arabic. Plain "Co Assistant" alone always stays English;
    // only this explicit suffix (or the native Arabic-pronunciation wake phrase below) goes Arabic.
    const AR_SUFFIX_RE = /^(?:in\s+)?(?:arabic|عربي|بالعربي|بالعربية)\b[\s,.:-]*/;

    // Arabic wake phrase: "كو اسيستانت". Speech-to-text renders this transliterated English term in wildly
    // different ways, so instead of one rigid pattern we fuzzy-match every Arabic word (or pair of words) near
    // the front of the sentence against a handful of likely spellings, and accept anything close enough.
    const AR_WAKE_FORMS = ['كواسيستانت', 'كوأسيستانت', 'كوإسيستانت', 'كواسيستنت', 'كواسستانت', 'كواسيستان', 'كوسيستانت', 'كوأسستنت'];
    function normAr(w) { return String(w || '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ''); }
    const AR_WAKE_TARGETS = AR_WAKE_FORMS.map(normAr);
    function levenshtein(a, b) {
        const m = a.length, n = b.length, d = [];
        for (let i = 0; i <= m; i++) d[i] = [i];
        for (let j = 0; j <= n; j++) d[0][j] = j;
        for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        return d[m][n];
    }
    // Looks for the Arabic wake phrase anywhere in `text` (normalized). Returns a match-like object
    // ({ index, 0: matchedText }, same shape a RegExp match gives us) or null.
    function findArabicWake(text) {
        const words = text.split(' ').filter(Boolean);
        const positions = []; let p = 0;
        for (const w of words) { positions.push(p); p += w.length + 1; }
        let bestI = -1, bestSpan = 0, bestDist = Infinity;
        for (let i = 0; i < words.length; i++) {
            if (!/[\u0600-\u06FF]/.test(words[i])) continue;
            for (let span = 1; span <= 2 && i + span <= words.length; span++) {
                const chunk = normAr(words.slice(i, i + span).join(''));
                if (chunk.length < 5) continue;
                for (const target of AR_WAKE_TARGETS) {
                    const th = target.length <= 8 ? 2 : 3;
                    const d = levenshtein(chunk, target);
                    if (d <= th && d < bestDist) { bestDist = d; bestI = i; bestSpan = span; }
                }
            }
        }
        if (bestI === -1) return null;
        return { index: positions[bestI], 0: words.slice(bestI, bestI + bestSpan).join(' ') };
    }

    // Voice controls for the countdown: "cancel" stops the command, "edit" drops it and listens for a new one.
    // Both accept the wake phrase in front, a few filler words, and the usual mis-hearings.
    const CTL_LEAD = '(?:' + WAKE_SRC + '[\\s,]+)?(?:(?:ok|okay|hey|please|just|i said)\\s+)*';
    const CTL_TAIL = '(?:\\s+(?:it|that|this|please|now|command|the command|my command|the last one))?';
    const CANCEL_STRICT = '(?:cancel|counsel|can sell|stop|never ?mind|abort|forget it|إلغاء|الغاء)';   // safe to act on while you are still talking
    const CANCEL_LOOSE  = '(?:no|wait|hold on|don\'?t|do not)';                              // only trusted once the sentence is finished
    const EDIT_WORDS    = '(?:edit|edits|edited|editing|change|modify|redo|re-?do|add it|at it|not that|wrong|try again|تعديل|غيّر|غير)';
    const CANCEL_S = new RegExp('^' + CTL_LEAD + CANCEL_STRICT + CTL_TAIL + '$');
    const CANCEL_L = new RegExp('^' + CTL_LEAD + '(?:' + CANCEL_STRICT + '|' + CANCEL_LOOSE + ')' + CTL_TAIL + '$');
    const EDIT_RE  = new RegExp('^' + CTL_LEAD + EDIT_WORDS + CTL_TAIL + '$');
    const STOP_RE    = new RegExp('^(?:' + WAKE_SRC + '[\\s,]+)?(stop|be quiet|quiet|silence|shut up|enough|cancel|توقف|اسكت|اصمت)(?: talking)?$');

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = window.speechSynthesis || null;
    const $ = (id) => document.getElementById(id);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const toast = (m, t) => { try { if (typeof showToast === 'function') showToast(m, t || 'info'); else console.log('[voice]', m); } catch (e) {} };

    const S = {
        enabled: false, userOff: false, blocked: false, mode: 'idle',   // idle | awake | countdown | busy
        recLang: 'en', wakeLang: 'en',   // 'en' | 'ar' — which wake phrase / mic language is active right now
        lastSpeechAt: 0, lastLangSwitchAt: 0,
        cmdBuf: '', cmdBufTimer: null,
        rec: null, listening: false, restartTimer: null, restarts: [], netWarned: false,
        awakeUntil: 0, awakeTimer: null,
        pending: null, cdTimer: null, busy: false, replyText: '',
        speaking: false, ttsSeq: 0, curResolve: null, ignoreUntil: 0, spoken: [],
        lastFinal: '', lastFinalAt: 0,
        seenFinals: new Map(), lastCmdKey: '',
        editing: false, prevCmd: '', ctlAt: 0
    };
    try { S.userOff = localStorage.getItem('va_off') === '1'; } catch (e) {}


    // ------------------------------------------------------------------
    // TEXT HELPERS
    // ------------------------------------------------------------------
    function norm(t) {
        return String(t || '').toLowerCase()
            .replace(/[\u2010-\u2015]/g, '-')
            .replace(/[\u2018\u2019]/g, "'")
            .replace(/[\u201c\u201d"`]/g, ' ')
            .replace(/[.,!?;:()]/g, ' ')
            .replace(/[\u060c\u061b\u061f]/g, ' ')                 // Arabic comma / semicolon / question mark
            .replace(/[\u064b-\u0652]/g, '')                       // strip Arabic diacritics (tashkeel)
            .replace(/\s+/g, ' ').trim();
    }
    const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
    const short = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;

    // 'cancel' | 'edit' | null  — is this whole sentence just a countdown control word?
    function ctlOf(t, loose) {
        t = norm(t);
        if (!t) return null;
        if (EDIT_RE.test(t)) return 'edit';
        if ((loose ? CANCEL_L : CANCEL_S).test(t)) return 'cancel';
        return null;
    }
    // Look at every alternative the recognizer offers ("cancel" is often heard as "counsel" and so on)
    function controlFrom(res, isFinal) {
        for (let i = 0; i < res.length; i++) {
            const c = ctlOf(res[i].transcript, isFinal && i === 0);
            if (c) return c;
        }
        return null;
    }

    const NUMW = { one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19, twenty: 20 };
    const ORDW = { first: 1, second: 2, third: 3, fourth: 4, fifth: 5, sixth: 6, seventh: 7, eighth: 8, ninth: 9, tenth: 10 };
    const toNum = (w) => /^\d+$/.test(w) ? parseInt(w, 10) : (NUMW[w] || null);

    // Clean text so the speech engine doesn't read symbols / emoji / markdown out loud.
    // The wake phrase is always masked so the mic can never mistake our own voice for it.
    function cleanForSpeech(t) {
        t = String(t || '');
        t = t.replace(new RegExp(WAKE_SRC, 'gi'), 'the assistant');
        for (let i = 0; i < 5; i++) {                        // mask the Arabic wake phrase too (best-effort fuzzy match)
            const m = findArabicWake(t);
            if (!m) break;
            t = t.slice(0, m.index) + 'المساعد' + t.slice(m.index + m[0].length);
        }
        t = t.replace(/https?:\/\/\S+/g, ' link ')
             .replace(/\^/g, ' to the power of ')
             .replace(/[→⇒]/g, ' gives ').replace(/⇌/g, ' in equilibrium with ')
             .replace(/\s*=\s*/g, ' equals ')
             .replace(/[*_#`~>|\\{}\[\]]/g, ' ')
             .replace(/[\u200d\ufe0f]/g, '');
        try { t = t.replace(new RegExp('\\p{Extended_Pictographic}', 'gu'), ' '); }
        catch (e) { t = t.replace(/[\u2600-\u27BF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|\uD83E[\uDC00-\uDFFF]/g, ' '); }
        return t.replace(/\s+/g, ' ').trim();
    }

    // Split into short chunks (Chrome silently cuts off long utterances)
    function chunkText(t) {
        const parts = t.match(/[^.!?\u061f\n]+[.!?\u061f]*/g) || [t];
        const out = []; let cur = '';
        for (const p of parts) {
            const s = p.trim(); if (!s) continue;
            if (cur && (cur + ' ' + s).length > 180) { out.push(cur); cur = s; }
            else cur = cur ? cur + ' ' + s : s;
        }
        if (cur) out.push(cur);
        const final = [];
        out.forEach((c) => {
            if (c.length > 220) (c.match(/.{1,200}(\s|$)/g) || [c]).forEach((x) => { x = x.trim(); if (x) final.push(x); });
            else final.push(c);
        });
        return final;
    }

    // ------------------------------------------------------------------
    // TEXT-TO-SPEECH
    // ------------------------------------------------------------------
    function pickVoice(lang) {
        if (!synth) return null;
        const vs = synth.getVoices(); if (!vs.length) return null;
        const base = lang.slice(0, 2).toLowerCase();
        const same = vs.filter((v) => v.lang.toLowerCase().replace('_', '-').startsWith(base));
        const prefs = base === 'ar' ? [/arab/i] : [/google us english/i, /(aria|jenny|guy).*(natural|online)/i, /samantha/i, /google uk english female/i, /(zira|david)/i];
        for (const re of prefs) { const v = same.find((x) => re.test(x.name)); if (v) return v; }
        return same.find((v) => v.lang.toLowerCase().replace('_', '-') === lang.toLowerCase()) || same[0] || null;
    }

    function logSpoken(c) {
        const now = Date.now();
        S.spoken.push({ t: norm(c), at: now });
        S.spoken = S.spoken.filter((s) => now - s.at < 20000);
    }
    // Did the mic just hear the assistant's own voice?
    function isEcho(text) {
        if (text.split(' ').length < 3) return false;
        const now = Date.now();
        return S.spoken.some((s) => now - s.at < 12000 && s.t.includes(text));
    }

    function speak(text) {
        return new Promise((resolve) => {
            if (!synth || !text) return resolve();
            let t = cleanForSpeech(text);
            if (!t) return resolve();
            if (t.length > CFG.MAX_SPOKEN_CHARS) {
                const cut = t.slice(0, CFG.MAX_SPOKEN_CHARS);
                const i = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('! '), cut.lastIndexOf('? '));
                t = (i > 200 ? cut.slice(0, i + 1) : cut) + ' You can read the rest on the screen.';
            }
            const prev = S.curResolve; S.curResolve = resolve; if (prev) prev();
            const seq = ++S.ttsSeq;
            try { synth.cancel(); synth.resume(); } catch (e) {}
            const lang = /[\u0600-\u06FF]/.test(t) ? 'ar-SA' : CFG.TTS_LANG;
            const voice = pickVoice(lang);
            const chunks = chunkText(t);
            let i = 0;
            S.speaking = true; render();

            const done = () => {
                if (S.ttsSeq === seq) { S.speaking = false; S.ignoreUntil = Date.now() + CFG.ECHO_TAIL_MS; render(); }
                if (S.curResolve === resolve) S.curResolve = null;
                resolve();
            };
            const next = () => {
                if (S.ttsSeq !== seq || i >= chunks.length) return done();
                const c = chunks[i++];
                logSpoken(c);
                const u = new SpeechSynthesisUtterance(c);
                u.lang = lang; if (voice) u.voice = voice; u.rate = CFG.SPEAK_RATE;
                let settled = false, wd;
                const go = () => { if (settled) return; settled = true; clearTimeout(wd); next(); };
                u.onend = go; u.onerror = go;
                wd = setTimeout(go, 3000 + c.length * 120);   // watchdog: some browsers never fire onend
                setTimeout(() => { if (S.ttsSeq === seq) { try { synth.speak(u); } catch (e) { go(); } } else go(); }, 30);
            };
            next();
        });
    }

    function stopSpeaking() {
        S.ttsSeq++;
        try { if (synth) synth.cancel(); } catch (e) {}
        S.speaking = false; S.ignoreUntil = Date.now() + CFG.ECHO_TAIL_MS;
        const r = S.curResolve; S.curResolve = null; if (r) r();
        render();
    }

    // ------------------------------------------------------------------
    // SOUNDS (countdown tick + wake chime)
    // ------------------------------------------------------------------
    let actx = null;
    function audioCtx() {
        try {
            actx = actx || new (window.AudioContext || window.webkitAudioContext)();
            if (actx.state === 'suspended') actx.resume();
        } catch (e) {}
        return actx;
    }
    function beep(freq, when, dur, vol) {
        const ctx = audioCtx(); if (!ctx) return;
        try {
            const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + when;
            o.frequency.value = freq;
            g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
        } catch (e) {}
    }
    const tick = (last) => { if (CFG.TICK_SOUND) beep(last ? 880 : 520, 0, 0.12, 0.05); };
    const chime = () => { if (CFG.CHIME) { beep(660, 0, 0.14, 0.06); beep(990, 0.13, 0.18, 0.06); } };

    // ------------------------------------------------------------------
    // PORTAL HELPERS (all use the site's real functions / data)
    // ------------------------------------------------------------------
    const inPortal = () => { const p = $('portal-section'); return !!p && !p.classList.contains('hidden'); };
    const allowedLectures = () => (typeof lectures !== 'undefined' ? lectures : []).filter((l) => !currentUser || currentUser.role !== 'student' || l.grade === currentUser.grade);

    function findLecture(n) {
        const list = allowedLectures();
        return list.find((l) => Number(l.lesson) === n || new RegExp('\\b(?:lecture|lesson|part)\\s*' + n + '\\b', 'i').test(l.title)) || list[n - 1] || null;
    }

    function statsText() {
        if (!currentUser) return 'Please sign in first.';
        if (hasAdminGrant()) return 'You are signed in as ' + currentUser.name + '. Staff accounts do not have student levels.';
        const done = currentUser.completed_lecture_ids || [];
        const list = allowedLectures();
        const watched = list.filter((l) => l.completed || done.includes(l.id)).length;
        const lvl = calculateLevelInfo(currentUser.xp || 0);
        return currentUser.name + ', you have watched ' + watched + ' of ' + list.length + ' sessions and earned ' + (currentUser.xp || 0) + ' experience points. You are level ' + lvl.level + ', ' + lvl.title + '.';
    }

    // Open the Co Assistant AI page, type the question there, wait for the written answer.
    async function askAssistant(q) {
        const input = $('ai-chat-prompt');
        if (!input || typeof submitAIChatMessage !== 'function') throw new Error('AI chat is not available');
        // respect the site's built-in anti-spam gap between AI messages
        const gap = 2700 - (Date.now() - (window.lastAISubmitTime || 0));
        if (gap > 0) await sleep(gap);
        switchTab('co-assistant');
        await sleep(200);
        const chatId = activeAIChatId;
        input.value = q;

        // The site can auto-jump to another tab when an answer mentions "dashboard", "videos"...
        // Hold that back while a voice answer is being written so you stay on the AI page.
        const origRedirect = window.autoDetectTabRedirect;
        const patched = typeof origRedirect === 'function';
        if (patched) window.autoDetectTabRedirect = function () {};
        try {
            const finished = await Promise.race([
                submitAIChatMessage().then(() => true),
                sleep(CFG.ANSWER_TIMEOUT_MS).then(() => false)
            ]);
            if (!finished) return { text: null, timeout: true };
            if (input.value === q) { input.value = ''; return { text: null, blocked: true }; }
            const chat = aiChats.find((c) => c.id === chatId);
            const last = chat && chat.messages[chat.messages.length - 1];
            return { text: last && last.role === 'assistant' ? last.text : null };
        } finally {
            if (patched) window.autoDetectTabRedirect = origRedirect;
        }
    }

    // ------------------------------------------------------------------
    // COMMAND PARSER  →  { label, say, run() }  |  { immediate }  |  { refuse }
    // ------------------------------------------------------------------
    const QUESTION_RE = /^(what|whats|what's|why|how|who|whom|whose|when|where|which|is|are|was|were|am|do|does|did|can|could|should|would|will|explain|tell me|define|describe|calculate|solve|give me|teach me|help me|show me how|compare|summarize|summarise|translate|write|list)\b/;
    const NAV = [
        { tab: 'admin',        name: 'system console',           re: /\b(admin(?:istrator)?|system console|control (?:panel|node)|console)\b/ },
        { tab: 'dashboard',    name: 'dashboard',                re: /\b(dashboard|home ?page|home|main page|overview)\b/ },
        { tab: 'videos',       name: 'video sessions',           re: /\b(videos?|lectures?|lessons?|sessions?|catalog|recordings?)\b/ },
        { tab: 'materials',    name: 'materials and worksheets', re: /\b(materials?|worksheets?|sheets?|pdfs?|documents?|homework|study notes?)\b/ },
        { tab: 'feed',         name: 'community feed',           re: /\b(feed|community|announcements?|news)\b/ },
        { tab: 'co-assistant', name: 'assistant chat',           re: /\b(co[\s-]?assistant|assistant|ai chat|ai|chat ?bot|chat|copilot)\b/ }
    ];
    const NUMRE = '(\\d+|' + Object.keys(NUMW).join('|') + ')';
    const LEC_NUM = new RegExp('\\b(?:lecture|lesson|video|session|part)\\s*(?:number\\s*|no\\s*|#\\s*)?' + NUMRE + '\\b');
    const LEC_ORD = new RegExp('\\b(' + Object.keys(ORDW).join('|') + ')\\s+(?:lecture|lesson|video|session)\\b');
    const LEC_LATEST = /\b(last|latest|newest|recent|most recent)\b.*\b(lecture|lesson|video|session)\b|\b(lecture|lesson|video|session)\b.*\b(last|latest|newest)\b/;

    // Anything that is a question / a longer request: open the AI page and answer as text.
    function askIntent(q, isQ) {
        const text = cap(q) + (isQ ? '?' : '');
        return {
            label: 'Asking Co Assistant', detail: '“' + short(text, 80) + '”',
            say: 'Okay, let me ask the assistant.',
            run: async () => {
                const r = await askAssistant(text);
                if (r.timeout) return 'Sorry, the assistant is taking too long. Please try again.';
                if (r.blocked || !r.text) return 'Sorry, I could not get an answer right now.';
                if (/^\s*\u26A0/.test(r.text) && /error/i.test(r.text)) return 'Sorry, I could not reach the assistant. Please try again in a moment.';
                // The full answer is already written as text on the AI page.
                // Short answers are also read out loud; long ones stay as text only.
                if (r.text.length <= CFG.SPEAK_ANSWER_MAX_CHARS) return { say: r.text };
                return { say: 'Your answer is ready on the screen.' };
            }
        };
    }

    function parseIntent(raw) {
        const original = norm(raw);
        let c = original;
        c = c.replace(/^(?:(?:hey|ok|okay|um|uh|so|now|and|then|please)\s+)+/, '');
        c = c.replace(/^(?:(?:can|could|would|will) you(?: please)?\s+|i (?:want|need) you to\s+|i(?:'d| would) like (?:you )?to\s+|i want to\s+|let'?s\s+|go ahead and\s+)/, '');
        c = c.replace(/\s+please$/, '').trim();
        if (!c) return null;
        const words = c.split(' ');
        const isQ = QUESTION_RE.test(c);
        const hasVerb = /^(open|go|goto|show|take|navigate|switch|bring|launch|start|display|move|visit|head|load|view|see|check|play|watch|run|begin)\b/.test(c);

        // --- instant controls (no countdown, they must react immediately) ---
        if (/^(stop|stop talking|be quiet|quiet|silence|shut up|enough)$/.test(c)) return { immediate: () => stopSpeaking() };
        if (/^(cancel|never ?mind|abort|forget it|don'?t)$/.test(c)) return { immediate: () => { if (S.pending) cancelPending(); } };

        // --- help ---
        if (/^(help|commands|what can you do|what are your commands|show commands|list commands|what commands.*)$/.test(c)) {
            return {
                label: 'Reading the command list', say: 'Okay, here is what I can do.',
                run: () => 'Say the wake phrase, then a command. You can say: open dashboard, open videos, open materials, open the feed, open the assistant, play the latest lecture, play lecture and a number, show my progress, dark mode, light mode, or log out. Or just ask me any question and I will answer it on the assistant page. Every command has a five second countdown, and you can say cancel to stop it, or edit to change it.'
            };
        }

        // --- turn voice control off ---
        if (/\b(stop|turn off|disable|switch off|deactivate|end)\b.*\b(listening|voice|microphone|mic)\b|^(goodbye|bye|bye bye)$/.test(c)) {
            return { label: 'Turning voice control off', say: 'Okay, turning voice control off.', run: () => { disable(); } };
        }

        // --- my stats ---
        if (/\b(my|our)\s+(stats|statistics|progress|xp|exp|level|rank|score|points)\b|\bhow am i doing\b/.test(c)) {
            return { label: 'Checking your progress', say: 'Checking your progress.', run: () => statsText() };
        }

        // --- log out ---
        if (!isQ && /\b(log ?out|sign ?out|log me out|sign me out)\b/.test(c)) {
            return { label: 'Logging you out', say: 'Logging you out.', run: () => { handleLogout(); } };
        }

        // --- theme ---
        if (!isQ) {
            const themeM = c.match(/\b(dark|light|night|day)\s*(?:mode|theme)\b/);
            const toggleM = /\b(toggle|switch|change|flip)\s+(?:the\s+)?theme\b/.test(c);
            if (themeM || toggleM) {
                const wantDark = themeM ? /dark|night/.test(themeM[1]) : null;
                const isLight = document.documentElement.classList.contains('light-theme');
                if (wantDark === true && !isLight) return { immediate: () => speak('It is already in dark mode.') };
                if (wantDark === false && isLight) return { immediate: () => speak('It is already in light mode.') };
                return {
                    label: wantDark === null ? 'Switching the theme' : (wantDark ? 'Switching to dark mode' : 'Switching to light mode'),
                    say: wantDark === null ? 'Switching the theme.' : (wantDark ? 'Switching to dark mode.' : 'Switching to light mode.'),
                    run: () => { toggleTheme(); }
                };
            }
        }

        // --- lectures ---
        if (!isQ && (hasVerb || words.length <= 4)) {
            let lec = null, spoken = '';
            if (LEC_LATEST.test(c)) {
                const list = allowedLectures(); lec = list[list.length - 1] || null; spoken = 'the latest lecture';
                if (!lec) return { refuse: 'There is no session available for your grade yet.' };
            } else {
                const m = c.match(LEC_NUM), o = c.match(LEC_ORD);
                const n = m ? toNum(m[1]) : (o ? ORDW[o[1]] : null);
                if (n) {
                    lec = findLecture(n); spoken = 'lecture ' + n;
                    if (!lec) return { refuse: 'Sorry, I could not find lecture ' + n + '.' };
                }
            }
            if (lec) {
                return {
                    label: 'Opening ' + spoken, detail: short(lec.title || '', 60), say: 'Opening ' + spoken + '.',
                    run: () => { switchTab('videos'); setTimeout(() => loadSecureLecture(lec), 120); toast('Opening: ' + lec.title, 'success'); }
                };
            }
        }

        // --- questions go straight to the AI page ---
        if (isQ) return askIntent(original, true);

        // --- page navigation ---
        if (hasVerb || words.length <= 3) {
            for (const n of NAV) {
                if (!n.re.test(c)) continue;
                if (n.tab === 'admin' && !hasAdminGrant()) return { refuse: 'Sorry, the system console needs an admin account.' };
                return {
                    label: 'Opening ' + n.name, say: 'Opening ' + n.name + '.',
                    run: () => { switchTab(n.tab); toast('Opened ' + n.name + '.', 'success'); }
                };
            }
        }

        // --- everything else (longer requests) = a question for the AI page ---
        if (original.length >= 4) return askIntent(original, false);
        return null;
    }

    // ------------------------------------------------------------------
    // ARABIC COMMANDS — say the Arabic wake phrase, then speak Arabic.
    // A lighter mirror of parseIntent() above for the commands people actually use;
    // anything else (a question, a longer request) goes straight to the AI page, which
    // answers in Arabic, and that Arabic reply is read aloud automatically.
    // ------------------------------------------------------------------
    function askIntentAR(q) {
        return {
            label: 'سؤال المساعد', detail: '“' + short(q, 80) + '”',
            say: 'حسنًا، سأسأل المساعد.',
            run: async () => {
                const r = await askAssistant(q);
                if (r.timeout) return 'عذرًا، تأخر المساعد في الرد. حاول مرة أخرى.';
                if (r.blocked || !r.text) return 'عذرًا، تعذر الحصول على إجابة الآن.';
                if (r.text.length <= CFG.SPEAK_ANSWER_MAX_CHARS) return { say: r.text };
                return { say: 'إجابتك جاهزة على الشاشة.' };
            }
        };
    }

    const NAV_AR = [
        { tab: 'admin',        name: 'لوحة النظام', re: /(لوحة\s*النظام|وحدة\s*التحكم|كونسول)/ },
        { tab: 'dashboard',    name: 'لوحة التحكم', re: /(لوحة\s*التحكم|الرئيسية|الصفحة\s*الرئيسية)/ },
        { tab: 'videos',       name: 'الفيديوهات',  re: /(فيديو|فيديوهات|محاضرات?|دروس|درس)/ },
        { tab: 'materials',    name: 'المواد',       re: /(مواد|ملفات|أوراق\s*عمل|واجب)/ },
        { tab: 'feed',         name: 'الخلاصة',      re: /(خلاصة|المجتمع|إعلانات)/ },
        { tab: 'co-assistant', name: 'المساعد',      re: /(مساعد|شات|دردشة)/ }
    ];

    function parseIntentAR(raw) {
        const c = norm(raw);
        if (!c) return null;

        if (/^(اسكت|اصمت|توقف)$/.test(c)) return { immediate: () => stopSpeaking() };
        if (/^(إلغاء|الغاء)$/.test(c)) return { immediate: () => { if (S.pending) cancelPending(); } };

        if (c.length < 30 && /(الأوامر|ماذا (تستطيع|يمكنك)|مساعدة)/.test(c)) {
            return {
                label: 'قراءة الأوامر', say: 'حسنًا، إليك ما يمكنني فعله.',
                run: () => 'قل عبارة التنبيه، ثم أمرًا: افتح لوحة التحكم، افتح الفيديوهات، افتح المواد، افتح الخلاصة، افتح المساعد، أظهر تقدمي، أو تسجيل الخروج. أو فقط اسألني أي سؤال وسأجيبك في صفحة المساعد.'
            };
        }

        if (/(أوقف|ايقاف|إيقاف).*(المساعد الصوتي|الصوت)|^(مع السلامة|وداعًا|وداعا)$/.test(c)) {
            return { label: 'إيقاف التحكم الصوتي', say: 'حسنًا، سأوقف التحكم الصوتي.', run: () => { disable(); } };
        }

        if (/(تقدمي|إحصائياتي|مستواي|نقاطي)/.test(c)) {
            return { label: 'التحقق من تقدمك', say: 'أتحقق من تقدمك.', run: () => statsText() };
        }

        if (/(تسجيل\s*الخروج|سجلني\s*خروج|^اخرج$)/.test(c)) {
            return { label: 'تسجيل الخروج', say: 'جارٍ تسجيل خروجك.', run: () => { handleLogout(); } };
        }

        const wantDark = /(الوضع\s*الداكن|الوضع\s*الليلي)/.test(c) ? true : (/(الوضع\s*الفاتح|الوضع\s*النهاري)/.test(c) ? false : null);
        if (wantDark !== null) {
            const isLight = document.documentElement.classList.contains('light-theme');
            if (wantDark === true && !isLight) return { immediate: () => speak('الوضع الداكن مفعل بالفعل.') };
            if (wantDark === false && isLight) return { immediate: () => speak('الوضع الفاتح مفعل بالفعل.') };
            return {
                label: wantDark ? 'التبديل إلى الوضع الداكن' : 'التبديل إلى الوضع الفاتح',
                say: wantDark ? 'جارٍ التبديل إلى الوضع الداكن.' : 'جارٍ التبديل إلى الوضع الفاتح.',
                run: () => { toggleTheme(); }
            };
        }

        // Short, clearly navigation-shaped utterances only — anything longer is treated as a question below
        if (c.length <= 24) {
            for (const n of NAV_AR) {
                if (!n.re.test(c)) continue;
                if (n.tab === 'admin' && !hasAdminGrant()) return { refuse: 'عذرًا، تحتاج لوحة النظام إلى حساب مسؤول.' };
                return {
                    label: 'فتح ' + n.name, say: 'جارٍ فتح ' + n.name + '.',
                    run: () => { switchTab(n.tab); toast('تم فتح ' + n.name, 'success'); }
                };
            }
        }

        // Everything else — questions and longer requests — go to the AI page, which replies in Arabic
        return askIntentAR(c);
    }

    // ------------------------------------------------------------------
    // DISPATCH  →  5s countdown  →  run
    // ------------------------------------------------------------------
    function dispatch(cmd, lang) {
        const key = norm(cmd);
        const ctl = ctlOf(key, true);                              // "cancel" / "edit" (also works as "Co Assistant, cancel")
        if (ctl) { runControl(ctl); return; }
        if (S.pending && S.pending.key === key) return;            // same command heard twice
        const intent = (lang === 'ar') ? parseIntentAR(cmd) : parseIntent(cmd);
        clearTimeout(S.awakeTimer);
        if (intent && intent.immediate) { if (S.mode === 'awake') S.mode = 'idle'; intent.immediate(); render(); return; }
        if (S.busy) return;
        S.mode = 'idle';
        if (!intent) { toast("Sorry, I didn't catch that.", 'warning'); speak("Sorry, I didn't catch that."); render(); return; }
        if (intent.refuse) { toast(intent.refuse, 'warning'); speak(intent.refuse); render(); return; }
        intent.key = key; intent.heard = cap(key); S.lastCmdKey = key;
        S.editing = false; S.prevCmd = '';
        startCountdown(intent);
    }

    // Fires the one-shot "click" ring + logo bounce — used the instant the wake
    // word is heard and again when a command is confirmed, for tactile feedback.
    function clickPulse() {
        const ring = $('va-click'), logo = $('va-logo-wrap');
        if (ring) { ring.classList.remove('va-fire'); void ring.offsetWidth; ring.classList.add('va-fire'); }
        if (logo) { logo.classList.remove('va-fire'); void logo.offsetWidth; logo.classList.add('va-fire'); }
    }

    const CIRC = 276.46;
    function startCountdown(intent) {
        cancelPending(true);
        S.pending = intent; S.mode = 'countdown';
        clickPulse();
        const total = CFG.COUNTDOWN_SECONDS;
        let left = total;
        if (left <= 0) return fire(intent);
        $('va-action').textContent = intent.label;
        $('va-detail').textContent = intent.detail || '';
        $('va-num').textContent = left;
        render();                                                  // un-hides the countdown first — a hidden ring can't animate
        showHeard(intent.heard || '', true);                       // keep showing what was heard, so you can spot a wrong command
        const fg = $('va-ring-fg');
        fg.style.transition = 'none'; fg.style.strokeDashoffset = '0'; void fg.getBoundingClientRect();
        fg.style.transition = 'stroke-dashoffset ' + total + 's linear'; fg.style.strokeDashoffset = String(CIRC);
        tick(false);
        if (CFG.SPEAK_CONFIRM) speak(intent.say);
        S.cdTimer = setInterval(() => {
            left--;
            if (left <= 0) fire(intent);
            else { $('va-num').textContent = left; tick(false); }
        }, 1000);
    }

    function cancelPending(silent) {
        clearInterval(S.cdTimer); S.cdTimer = null;
        const had = !!S.pending; S.pending = null;
        if (S.mode === 'countdown') S.mode = 'idle';
        if (had && !silent) { stopSpeaking(); toast('Command cancelled.', 'info'); speak('Cancelled.'); }
        render();
    }

    // A countdown control word was heard (or a button was pressed)
    function runControl(ctl) {
        S.ctlAt = Date.now();
        if (ctl === 'edit') {
            if (S.pending) editCommand();                                  // drop the command, listen for a new one
            else if (S.mode === 'awake') enterAwake();                     // already waiting for a command: keep listening
            return;
        }
        if (S.pending) { cancelPending(); return; }
        if (S.speaking) stopSpeaking();
        if (S.mode === 'awake') { clearTimeout(S.awakeTimer); S.mode = 'idle'; S.editing = false; }
        render();
    }

    // "edit": throw the pending command away and go straight back to listening — no wake phrase needed
    function editCommand() {
        if (!S.pending || S.busy) return;
        S.prevCmd = S.pending.heard || '';
        clearInterval(S.cdTimer); S.cdTimer = null; S.pending = null;
        stopSpeaking(); S.ignoreUntil = 0;                                 // nothing is playing any more, so no echo to wait out
        S.editing = true;
        enterAwake();                                                      // fresh listening window + chime
        showHeard('', true);
    }

    async function fire(intent) {
        clearInterval(S.cdTimer); S.cdTimer = null;
        S.pending = null; S.mode = 'busy'; S.busy = true; render(); tick(true);   // overlay closes so you can see the result
        try {
            const out = await intent.run();
            let say = '', show = false;
            if (typeof out === 'string') { say = out; show = true; }         // plain text replies are also shown in the overlay
            else if (out && typeof out === 'object' && out.say) { say = out.say; }
            if (say) {
                if (show) { S.replyText = say; render(); }
                await speak(say);
                if (show && S.replyText) await sleep(1200);
            }
        } catch (err) {
            console.error('[voice]', err);
            toast('Voice command failed: ' + (err && err.message ? err.message : err), 'error');
            await speak('Sorry, something went wrong.');
        } finally {
            S.replyText = ''; S.busy = false; if (S.mode === 'busy') S.mode = 'idle'; render();
        }
    }

    function dismiss() {
        clearTimeout(S.awakeTimer);
        cancelPending(true); stopSpeaking();
        S.replyText = ''; S.mode = S.busy ? 'busy' : 'idle'; S.editing = false;
        render();
    }

    // ------------------------------------------------------------------
    // LISTENING
    // ------------------------------------------------------------------
    // Which wake phrase (English or Arabic) is present, and where — whichever comes first
    function wakeMatch(text) {
        const en = text.match(WAKE_RE), ar = findArabicWake(text);
        if (en && ar) return ar.index < en.index ? { m: ar, lang: 'ar' } : { m: en, lang: 'en' };
        if (en) return { m: en, lang: 'en' };
        if (ar) return { m: ar, lang: 'ar' };
        return null;
    }

    function enterAwake(lang) {
        const wasAwake = S.mode === 'awake';
        S.mode = 'awake'; S.awakeUntil = Date.now() + CFG.COMMAND_WINDOW_MS;
        if (lang) S.wakeLang = lang;
        // Make sure the mic is actually listening in the right language for what comes next — e.g.
        // right after "Co Assistant Arabic" the command that follows is spoken in Arabic, so the
        // recognizer needs to switch to ar-SA immediately rather than waiting for the next idle swap.
        if (lang && S.recLang !== lang) {
            S.recLang = lang;
            if (S.rec) { try { S.rec.abort(); } catch (e) {} }
        }
        clearTimeout(S.awakeTimer);
        S.awakeTimer = setTimeout(() => { if (S.mode === 'awake') { S.mode = 'idle'; S.editing = false; render(); } }, CFG.COMMAND_WINDOW_MS);
        if (!wasAwake) { chime(); clickPulse(); }
        render();
    }

    // Speech recognizers split one sentence into several "final" chunks whenever you pause for breath
    // (very common on phones), so instead of acting the instant the first chunk arrives, we collect chunks
    // into a buffer and only run the command once you have actually stopped talking for a moment. This is
    // what lets "what's 3 + 4" finish instead of firing on "what's".
    function bufferAppend(text) {
        if (!text) return;
        // Phones sometimes re-send words they already gave us (the same chunk again, or the same words with more on the end).
        // Fold those into the buffer instead of stacking them up as "open open dashboard".
        const cur = S.cmdBuf;
        if (!cur) S.cmdBuf = text;
        else if (text === cur || (text.length >= 6 && cur.endsWith(' ' + text))) { /* same chunk again — ignore */ }
        else if (text.startsWith(cur + ' ')) S.cmdBuf = text;
        else S.cmdBuf = cur + ' ' + text;
        showHeard(S.cmdBuf, true);
        enterAwake(S.wakeLang);                                   // keep the listening window open while more is being said
        clearTimeout(S.cmdBufTimer);
        S.cmdBufTimer = setTimeout(finalizeBuffer, CFG.CMD_SILENCE_MS);
    }
    function finalizeBuffer() {
        S.cmdBufTimer = null;
        const full = S.cmdBuf.trim(), lang = S.wakeLang;
        S.cmdBuf = '';
        if (full) dispatch(full, lang);
    }
    function clearBuffer() { clearTimeout(S.cmdBufTimer); S.cmdBufTimer = null; S.cmdBuf = ''; }

    function handleFinal(raw) {
        const text = norm(raw);
        if (!text) return;
        const now = Date.now();
        S.lastSpeechAt = now;
        if (text === S.lastFinal && now - S.lastFinalAt < (IS_TOUCH ? 5000 : 2500)) return;   // Android Chrome sometimes repeats results
        S.lastFinal = text; S.lastFinalAt = now;

        // "cancel" / "edit" work during the countdown, or while a command is still being buffered, without the wake phrase
        const ctl = ctlOf(text, true);
        if (ctl && now - S.ctlAt < 1800) return;                          // already acted on it from the live (interim) result
        if (S.pending && ctl) { runControl(ctl); return; }
        if (S.cmdBufTimer && ctl) {
            clearBuffer();
            if (ctl === 'edit') { showHeard('', true); enterAwake(S.wakeLang); }
            else { S.mode = S.busy ? 'busy' : 'idle'; render(); }
            return;
        }
        // while it is talking, only listen for "stop"
        if (S.speaking) { if (STOP_RE.test(text)) stopSpeaking(); return; }
        if (now < S.ignoreUntil || isEcho(text)) return;

        const w = wakeMatch(text);
        if (w) {
            let lang = w.lang;
            const before = text.slice(0, w.m.index).replace(/\b(hey|hi|hello|ok|okay)\b/g, ' ').replace(/\s+/g, ' ').trim();
            let cmd = text.slice(w.m.index + w.m[0].length).replace(/^[\s,.:-]+/, '');
            if (lang === 'en') {
                while (WAKE_START.test(cmd)) cmd = cmd.replace(WAKE_START, '');
                // "Co Assistant Arabic" / "Co Assistant عربي" right after the wake phrase explicitly
                // switches this interaction to Arabic — plain "Co Assistant" always stays English.
                if (AR_SUFFIX_RE.test(cmd)) { cmd = cmd.replace(AR_SUFFIX_RE, ''); lang = 'ar'; }
            }
            const command = cmd || before;
            // The same command arriving again while it is already counting down / running is a repeated result, not a new request —
            // without this guard it flipped the overlay from the countdown back to "listening".
            if (command && (S.pending || S.busy) && command === S.lastCmdKey) return;
            clearBuffer(); S.wakeLang = lang; enterAwake(lang);
            if (command) bufferAppend(command);                  // "open dashboard, Co Assistant" also works
            else showHeard('', true);
            return;
        }
        if (S.mode === 'awake' && now < S.awakeUntil) bufferAppend(text);
        // no wake phrase + not awake = ignored on purpose
    }

    // Prefer the recognizer alternative that actually contains the wake phrase
    function pickAlt(res) {
        const top = res[0].transcript;
        const hasWake = (s) => { const n = norm(s); return WAKE_RE.test(n) || !!findArabicWake(n); };
        if (hasWake(top)) return top;
        for (let i = 1; i < res.length; i++) if (hasWake(res[i].transcript)) return res[i].transcript;
        return top;
    }


    function onResult(ev) {
        let interim = '';
        for (let i = ev.resultIndex; i < ev.results.length; i++) {
            const res = ev.results[i];
            // During the countdown react the instant "cancel" / "edit" is heard — no waiting for the sentence to finish
            if (S.pending) { const c = controlFrom(res, res.isFinal); if (c) { runControl(c); return; } }
            if (res.isFinal) {
                // Each final result is handled once. Some phones fire the same final again (or re-list old ones) on the next event.
                const raw = pickAlt(res), k = i + '|' + norm(raw), t = Date.now();
                const seenAt = S.seenFinals.get(k);
                if (seenAt && t - seenAt < 8000) continue;
                S.seenFinals.set(k, t);
                if (S.seenFinals.size > 40) S.seenFinals.delete(S.seenFinals.keys().next().value);
                handleFinal(raw);
            }
            else interim += res[0].transcript;
        }
        if (!interim || S.speaking || S.mode === 'countdown' || S.busy) return;
        S.lastSpeechAt = Date.now();
        const n = norm(interim);
        // The overlay opens the instant the wake phrase is heard, then "types" what you say live
        if (S.mode === 'idle' && Date.now() >= S.ignoreUntil && !isEcho(n)) {
            const w = wakeMatch(n);
            if (w) enterAwake(w.lang);
        }
        if (S.mode === 'awake') showHeard((S.cmdBuf ? S.cmdBuf + ' ' : '') + interim, false);
    }

    function startRec() {
        if (!SR || !S.enabled || S.rec) return;
        const rec = new SR();
        S.seenFinals.clear();                                     // result numbering starts over with every new mic session
        rec.lang = S.recLang === 'ar' ? CFG.AR_LANG : CFG.LANG; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 5;
        rec.onstart = () => { S.listening = true; S.netWarned = false; render(); };
        rec.onresult = onResult;
        rec.onerror = (e) => {
            if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                toast('Microphone is blocked. Allow it in the browser address bar, then tap the mic button.', 'error');
                S.enabled = false; S.blocked = true;
                teardown();
            } else if (e.error === 'audio-capture') {
                toast('No microphone was found.', 'error');
                S.enabled = false; S.blocked = true; teardown();
            } else if (e.error === 'network') {
                if (!S.netWarned) { S.netWarned = true; toast('Voice recognition needs an internet connection.', 'warning'); }
            }
        };
        rec.onend = () => { S.rec = null; S.listening = false; render(); if (S.enabled) scheduleRestart(); };
        S.rec = rec;
        try { rec.start(); } catch (e) { S.rec = null; scheduleRestart(1200); }
    }

    function scheduleRestart(delay) {
        clearTimeout(S.restartTimer);
        const now = Date.now();
        S.restarts = S.restarts.filter((t) => now - t < 10000); S.restarts.push(now);
        const d = delay || (S.restarts.length > 6 ? 3000 : 250);   // back off if the browser keeps ending the session
        S.restartTimer = setTimeout(startRec, d);
    }

    // Only swap the mic's language during genuine silence (never mid-sentence, and not too often),
    // so it still takes turns listening for the English and Arabic wake phrase without interrupting you.
    function idleLangSwitchTick() {
        const now = Date.now();
        if (!S.enabled || S.mode !== 'idle' || S.speaking || !S.rec) return;
        if (now - S.lastSpeechAt < CFG.IDLE_SILENCE_BEFORE_SWITCH_MS) return;
        if (now - S.lastLangSwitchAt < CFG.IDLE_LANG_SWITCH_MIN_GAP_MS) return;
        S.recLang = S.recLang === 'ar' ? 'en' : 'ar';
        S.lastLangSwitchAt = now;
        try { S.rec.abort(); } catch (e) {}
    }

    function teardown() {
        clearTimeout(S.restartTimer); clearTimeout(S.awakeTimer);
        if (S.rec) { S.rec.onend = null; S.rec.onerror = null; try { S.rec.abort(); } catch (e) {} S.rec = null; }
        S.listening = false;
        cancelPending(true); stopSpeaking();
        S.replyText = ''; S.mode = 'idle'; S.busy = false; S.editing = false; render();
    }

    function enable(quiet) {
        if (!SR) { if (!quiet) toast('Voice control needs Chrome, Edge or Samsung Internet on this device.', 'error'); return; }
        if (!inPortal()) return;
        S.enabled = true; S.userOff = false; S.blocked = false;
        try { localStorage.setItem('va_off', '0'); } catch (e) {}
        unlockAudio();
        S.mode = 'idle'; render(); startRec();
        if (!quiet) speak('Voice control is on.');
    }

    function disable() {
        S.enabled = false; S.userOff = true;
        try { localStorage.setItem('va_off', '1'); } catch (e) {}
        teardown();
        speak('Voice control is off.');
    }

    // Browsers only allow sound after a user gesture — unlock it on the first tap/click/key anywhere
    let unlocked = false;
    function unlockAudio() {
        if (unlocked) return;
        try { if (synth) { synth.cancel(); const w = new SpeechSynthesisUtterance(' '); w.volume = 0; synth.speak(w); } } catch (e) {}
        audioCtx();
        unlocked = true;
    }

    // ------------------------------------------------------------------
    // UI
    // ------------------------------------------------------------------
    const MIC_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>';
    const LOGO_FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></svg>');

    function showHeard(t, final) {
        const el = $('va-heard'); if (!el) return;
        el.textContent = t ? '“' + String(t).trim() + '”' : '';
        el.classList.toggle('va-interim', !final && !!t);
    }

    function render() {
        const ov = $('va-overlay'); if (!ov) return;
        const btn = $('va-mic-btn');
        if (btn) {
            btn.classList.toggle('va-on', S.enabled);
            btn.classList.toggle('va-awake', S.enabled && (S.mode !== 'idle' || S.speaking));
            btn.setAttribute('aria-pressed', S.enabled ? 'true' : 'false');
            btn.title = S.enabled ? 'Voice control is ON — say “Co Assistant” + a command. Tap to turn off' : 'Voice control is OFF — tap to turn on';
        }
        const showReply = !!S.replyText;
        const show = S.enabled && inPortal() && (S.mode === 'awake' || S.mode === 'countdown' || showReply);
        ov.classList.toggle('va-show', show);
        ov.setAttribute('aria-hidden', show ? 'false' : 'true');
        ov.dataset.mode = showReply ? 'reply' : S.mode;
        ov.classList.toggle('va-speaking', S.speaking);           // waves turn purple only while it is talking

        const ar = S.wakeLang === 'ar';
        let msg;
        if (showReply) msg = S.speaking ? (ar ? 'يتحدث…' : 'Speaking…') : (ar ? 'كو اسيستانت' : 'Co Assistant');
        else if (S.mode === 'countdown') msg = ar ? 'تم استلام الأمر' : 'Command received';
        else if (S.mode === 'awake') msg = ar ? (S.editing ? 'تعديل — قل أمرك الجديد' : 'أستمع — قل أمرك') : (S.editing ? 'Editing — say your new command' : 'Listening — say your command');
        else msg = ar ? 'كو اسيستانت' : 'Co Assistant';
        $('va-status').textContent = msg;

        const was = $('va-was');
        if (was) { const showWas = S.editing && S.mode === 'awake' && !!S.prevCmd && !showReply; was.classList.toggle('va-hidden', !showWas); was.textContent = showWas ? 'Was: “' + short(S.prevCmd, 60) + '”' : ''; }
        $('va-heard').classList.toggle('va-hidden', showReply);
        $('va-count').classList.toggle('va-hidden', S.mode !== 'countdown' || showReply);
        $('va-reply').classList.toggle('va-hidden', !showReply);
        $('va-reply').textContent = S.replyText;
        $('va-stop').classList.toggle('va-hidden', !S.speaking);
        if (!show) showHeard('', true);
    }

    function buildUI() {
        let btn = $('va-mic-btn');
        if (!btn) {
            btn = document.createElement('button');
            btn.id = 'va-mic-btn'; btn.type = 'button';
            btn.className = 'p-2 rounded-xl bg-slate-950/40 hover:bg-white/5 border border-white/5 text-gray-400 hover:text-white transition interactive-btn flex items-center justify-center shadow-md';
            btn.innerHTML = MIC_SVG;
            const themeIcon = $('theme-icon'), themeBtn = themeIcon && themeIcon.closest('button');
            if (themeBtn && themeBtn.parentNode) themeBtn.parentNode.insertBefore(btn, themeBtn);
            else { btn.classList.add('va-fab'); document.body.appendChild(btn); }
        }
        btn.addEventListener('click', () => { S.enabled ? disable() : enable(); });
        if (!SR) btn.title = 'Voice control is not supported in this browser (use Chrome, Edge or Samsung Internet)';

        const ov = document.createElement('div');
        ov.id = 'va-overlay'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-live', 'polite'); ov.setAttribute('aria-label', 'Co Assistant voice control'); ov.dataset.mode = 'idle';
        ov.innerHTML =
            '<div id="va-card">' +
                '<div id="va-stage">' +
                    '<span class="va-wave-out"></span><span class="va-wave-out"></span><span class="va-wave-out"></span>' +
                    '<span class="va-wave-in"></span><span class="va-wave-in"></span>' +
                    '<span class="va-click-ring" id="va-click"></span>' +
                    '<div id="va-logo-wrap"><img id="va-logo" src="ai.png" alt="Co Assistant"></div>' +
                '</div>' +
                '<div id="va-status"></div>' +
                '<div id="va-was" class="va-hidden"></div>' +
                '<div id="va-heard"></div>' +
                '<div id="va-count" class="va-hidden">' +
                    '<div class="va-ring"><svg viewBox="0 0 100 100"><circle class="va-ring-bg" cx="50" cy="50" r="44"/><circle id="va-ring-fg" cx="50" cy="50" r="44"/></svg><b id="va-num">5</b></div>' +
                    '<div id="va-action"></div><div id="va-detail"></div>' +
                    '<div id="va-btns"><button id="va-now" type="button">Do it now</button><button id="va-edit" type="button">Edit</button><button id="va-cancel" type="button">Cancel</button></div>' +
                    '<small>Or just say “cancel” or “edit”</small>' +
                '</div>' +
                '<div id="va-reply" class="va-hidden"></div>' +
                '<div id="va-foot"><button id="va-stop" type="button" class="va-hidden">Stop talking</button><button id="va-close" type="button">Close</button><button id="va-off" type="button">Turn voice control off</button></div>' +
            '</div>';
        document.body.appendChild(ov);
        const logo = $('va-logo');
        logo.onerror = () => { logo.onerror = null; logo.src = LOGO_FALLBACK; };
        $('va-close').addEventListener('click', dismiss);
        $('va-off').addEventListener('click', disable);
        $('va-cancel').addEventListener('click', () => cancelPending());
        $('va-edit').addEventListener('click', editCommand);
        $('va-now').addEventListener('click', () => { if (S.pending) fire(S.pending); });
        $('va-stop').addEventListener('click', () => { stopSpeaking(); S.replyText = ''; render(); });
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape' || !ov.classList.contains('va-show')) return;
            if (S.pending) cancelPending(); else dismiss();
        });
    }

    // Start automatically once you are inside the portal; stop when you log out
    function syncSession() {
        const inside = inPortal();
        if (!inside && S.enabled) { S.enabled = false; teardown(); }
        if (inside && !S.enabled && CFG.AUTO_START && SR && !S.userOff && !S.blocked) enable(true);
        render();
    }

    function init() {
        buildUI();
        ['pointerdown', 'keydown', 'touchstart'].forEach((ev) => document.addEventListener(ev, unlockAudio, { once: true, capture: true }));
        if (synth) { try { synth.getVoices(); synth.onvoiceschanged = () => synth.getVoices(); } catch (e) {} }
        // Browsers pause the mic in background tabs — wake it back up when you return
        document.addEventListener('visibilitychange', () => { if (!document.hidden && S.enabled && !S.rec) startRec(); });
        setInterval(syncSession, 1000);
        setInterval(idleLangSwitchTick, CFG.IDLE_LANG_CHECK_MS);
        syncSession();
    }

    // Handy for testing without a microphone, in the browser console:
    //   voiceAssistant.run('open dashboard')     voiceAssistant.parse('what is photosynthesis')
    window.voiceAssistant = { enable, disable, speak, stop: stopSpeaking, run: (cmd) => { if (!S.enabled) enable(true); dispatch(cmd); }, parse: parseIntent, config: CFG };

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
})();
</script>
